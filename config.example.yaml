# Copy to config.yaml and adjust (deploy.sh does this on first install).
# config.yaml is not tracked in git; the TUI Settings screen writes to it.
database:
  db_name: pi_controller
  host: localhost
  password: ${DB_PASSWORD}
  pool_size: 10
  port: 5432
  user: pi_controller
network:
  probe_auth: key
  probe_deploy_key: false
  probe_ssh: true
  probe_timeout_s: 5
  probe_username: pi
  scan_interval_s: 86400
  subnet: 10.10.20.0/24
server:
  host: 0.0.0.0
  log_level: INFO
  port: 8000
  workers: 1  # must be 1 — scheduler + runtime settings are per-process
ssh:
  parallel_limit: 10
  private_key_path: /opt/pi-controller/.ssh/id_rsa
  retry_count: 3
  retry_delay_s: 1
  timeout_s: 30
  username: pi
# Optional — shell commands for fleet actions (defaults shown).
# reboot: no sudo — Raspberry Pi OS polkit allows logind reboot for the SSH user; detached, so the command
#   returns at once and the Pi reboots ~3 s later. Where polkit doesn't allow it, set your own command.
# throttled: sysfs file needs no special group; vcgencmd fallback needs the SSH user in the `video` group.
pi_commands:
  reboot: "LC_ALL=C nohup sh -c 'sleep 3; systemctl reboot' >/dev/null 2>&1 &"
  throttled: cat /sys/devices/platform/soc/soc:firmware/get_throttled 2>/dev/null || vcgencmd get_throttled
  disk: df -P /
