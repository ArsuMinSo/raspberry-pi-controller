# Pi Controller — installed by scripts/deploy.sh to /etc/nginx/sites-available/pi-controller
# Web page at /, API proxied to uvicorn on 127.0.0.1:8000. Plain HTTP on the LAN for now
# (HTTPS later: docs/design/web-service.md).

# Login attempts per client IP (on top of the backend's per-user lockout)
limit_req_zone $binary_remote_addr zone=pic_login:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/pi-controller/web-current;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    access_log /var/log/nginx/pi-controller.access.log;
    error_log  /var/log/nginx/pi-controller.error.log;

    location = /api/v1/auth/login {
        limit_req zone=pic_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/pi-controller-proxy.conf;
    }

    location /api/ {
        include snippets/pi-controller-proxy.conf;
    }

    # Web page (Angular single-page app): unknown paths fall back to index.html
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, so a new release shows up on reload
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
