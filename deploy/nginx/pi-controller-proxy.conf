# Pi Controller — installed by scripts/deploy.sh to /etc/nginx/snippets/pi-controller-proxy.conf
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (never append): uvicorn trusts this header from 127.0.0.1, so a client
# must not be able to supply its own address.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# The TUI break-glass key only works on direct local connections — never through nginx
proxy_set_header X-PiC-Local-Key "";
proxy_set_header X-PiC-Local-User "";
proxy_read_timeout 300s;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
